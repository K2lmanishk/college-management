{% extends "base.html" %}
{% block content %}
<h1>Mark Attendance</h1>
<form method="POST" id="attForm">
    <select name="subject_id" id="subjSelect" class="form-select mb-2" required>
        <option value="">-- Select Subject --</option>{% for a in assignments %}<option value="{{ a.subject.id }}">{{ a.subject.name }} ({{ a.subject.semester }})</option>{% endfor %}
    </select>
    <input type="date" name="date" value="{{ today }}" class="form-control mb-2" required>
    <button type="button" class="btn btn-info" onclick="loadStudents()">Load Students</button>
    <div id="studentList" style="display:none; margin-top:20px;">
        <table class="table table-bordered"><thead class="table-dark"><tr><th>Roll No</th><th>Student</th><th>Status</th><th>WhatsApp</th></tr></thead><tbody id="studentTbody"></tbody></table>
        <button type="submit" class="btn btn-primary">Save Attendance</button>
    </div>
</form>
<script>
function loadStudents(){
    let subj=document.getElementById('subjSelect').value;
    if(!subj){ alert('Select subject'); return; }
    fetch('/api/get_students_by_subject/'+subj).then(res=>res.json()).then(data=>{
        let html=''; data.forEach(s=>{
            html+=`<tr><td>${s.roll_no}</td><td>${s.name}</td>
            <td><select name="status_${s.id}" class="form-select"><option>Present</option><option>Absent</option></select></td>
            <td><button class="btn btn-sm btn-success" onclick="sendWhatsApp('${s.phone}','${s.name}')">WhatsApp</button></td></tr>`;
        });
        document.getElementById('studentTbody').innerHTML=html;
        document.getElementById('studentList').style.display='block';
    });
}
function sendWhatsApp(phone,name){ if(phone) window.open(`https://wa.me/${phone}?text=Dear ${name}, your attendance has been marked.`); else alert('No phone'); }
</script>
{% endblock %}

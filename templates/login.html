{% extends 'base.html' %}
{% block title %}Login - {{ college_name }}{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg,#667eea,#764ba2);">
  <div class="card shadow-lg p-4" style="max-width:420px; width:100%; border-radius:24px;">
    <div class="text-center mb-3">
      <i class="bi bi-mortarboard-fill text-primary" style="font-size:3rem;"></i>
      <h3 class="mt-2">{{ college_name }}</h3>
      <p class="text-muted">{{ college_address }}</p>
    </div>
    {% include 'partials/messages.html' %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">{{ form.username }}</div>
      <div class="mb-3">{{ form.password }}</div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <a href="{% url 'admission_form' %}" class="text-center mt-3 d-block">New Student? Apply Online</a>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<h2>Enter Marks</h2>
<form method="post" class="card p-3">
  {% csrf_token %}
  <div class="row g-2">
    <div class="col-md-5">
      <select name="subject_id" id="subject" class="form-select" required>
        <option value="">Select subject</option>
        {% for a in assignments %}<option value="{{ a.subject.id }}">{{ a.subject.name }} — {{ a.subject.semester }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <select name="exam_type" class="form-select"><option>Internal 1</option><option>Internal 2</option><option>Midterm</option><option>Final</option><option>Practical</option></select>
    </div>
    <div class="col-md-2"><input type="number" name="max_marks" class="form-control" value="100" min="1" required></div>
  </div>
  <table class="table mt-3">
    <thead><tr><th>Roll no</th><th>Name</th><th>Marks obtained</th></tr></thead>
    <tbody id="studentRows"><tr><td colspan="3" class="text-muted">Select a subject to load students.</td></tr></tbody>
  </table>
  <button class="btn btn-primary" style="max-width:200px;">Save Marks</button>
</form>
{% endblock %}

{% block scripts %}
<script>
const base = "{% url 'get_students_by_subject' 0 %}";
document.getElementById('subject').addEventListener('change', async e => {
  const tbody = document.getElementById('studentRows');
  tbody.innerHTML = '';
  if (!e.target.value) return;
  const res = await fetch(base.replace('/0/', '/' + e.target.value + '/'));
  const students = await res.json();
  if (!students.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="text-muted">No students in this subject\'s program/semester.</td></tr>';
    return;
  }
  students.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td><input type="number" step="0.01" min="0" class="form-control form-control-sm" style="max-width:120px" name="marks_' + s.id + '"></td>';
    tr.children[0].textContent = s.roll_no;
    tr.children[1].textContent = s.name;
    tbody.appendChild(tr);
  });
});
</script>
{% endblock %}

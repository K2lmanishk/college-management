{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<div class="row mt-4 g-3">
  <div class="col-md-4">
    <div class="card stat-card p-3 text-white" style="background:linear-gradient(135deg,#667eea,#764ba2);">
      <i class="bi bi-people-fill fs-2"></i>
      <h2>{{ total_students }}</h2><div>Total Students</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card stat-card p-3 text-white" style="background:linear-gradient(135deg,#11998e,#38ef7d);">
      <i class="bi bi-person-badge-fill fs-2"></i>
      <h2>{{ total_faculty }}</h2><div>Faculty Members</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card stat-card p-3 text-white" style="background:linear-gradient(135deg,#fc4a1a,#f7b733);">
      <i class="bi bi-book-half fs-2"></i>
      <h2>{{ total_programs }}</h2><div>Active Programs</div>
    </div>
  </div>
</div>
{% endblock %}

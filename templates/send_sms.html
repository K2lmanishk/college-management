{% extends "base.html" %}
{% block content %}
<h1>Send SMS</h1>
<div class="row"><div class="col-md-6"><div class="card"><div class="card-header">Bulk SMS</div><div class="card-body"><form method="POST" action="{{ url_for('bulk_sms') }}"><select name="audience" class="form-select mb-2"><option value="all_students">All Students</option><option value="due_fees">Due Fees</option></select><textarea name="message" rows="4" class="form-control mb-2" maxlength="160" required></textarea><button type="submit" class="btn btn-primary">Send</button></form></div></div></div></div>
{% endblock %}

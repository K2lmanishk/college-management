{% extends "base.html" %}
{% block content %}
<h1>Attendance Log</h1>
<table class="table table-bordered">
    <thead class="table-dark"><tr><th>Date</th><th>Subject</th><th>Semester</th><th>Status</th></tr></thead>
    <tbody>{% for att, sub in attendance %}<tr><td>{{ att.date.strftime('%d %b %Y') }}</td><td>{{ sub.name }}</td><td>{{ sub.semester }}</td><td><span class="badge bg-{{ 'success' if att.status=='Present' else 'danger' }}">{{ att.status }}</span></td></tr>{% endfor %}</tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h1>My Profile</h1>
<div class="row"><div class="col-md-4"><div class="card text-center"><div class="card-body"><img src="{% if current_user.profile_pic and current_user.profile_pic!='default.png' %}{{ current_user.profile_pic }}{% else %}https://ui-avatars.com/api/?name={{ current_user.full_name }}&size=100&background=4e73df&color=fff{% endif %}" class="rounded-circle border border-3 border-primary" style="width:100px"><h5>{{ current_user.full_name }}</h5><p><span class="badge bg-primary">{{ current_user.role|capitalize }}</span></p><p><i class="bi bi-envelope"></i> {{ current_user.email }}</p><form method="POST" action="{{ url_for('upload_profile_pic') }}" enctype="multipart/form-data"><input type="file" name="profile_pic" class="form-control mb-2"><button type="submit" class="btn btn-sm btn-outline-primary">Upload</button></form></div></div></div>
<div class="col-md-8"><div class="card"><div class="card-header bg-success text-white">Edit Profile</div><div class="card-body"><form method="POST" action="{{ url_for('update_profile') }}"><input type="text" name="full_name" value="{{ current_user.full_name }}" class="form-control mb-2" required>{% if student %}<input type="text" name="phone" value="{{ student.phone or '' }}" class="form-control mb-2" placeholder="Phone"><textarea name="address" class="form-control mb-2">{{ student.address or '' }}</textarea><input type="text" name="parent_contact" value="{{ student.parent_contact or '' }}" class="form-control mb-2" placeholder="Parent Contact">{% endif %}{% if faculty %}<input type="text" name="department" value="{{ faculty.department or '' }}" class="form-control mb-2"><input type="text" name="designation" value="{{ faculty.designation or '' }}" class="form-control mb-2"><input type="text" name="qualification" value="{{ faculty.qualification or '' }}" class="form-control mb-2">{% endif %}<button type="submit" class="btn btn-success">Save Changes</button></form></div></div>
<div class="card mt-3"><div class="card-header bg-warning">Change Username</div><div class="card-body"><form method="POST" action="{{ url_for('change_username') }}"><input type="text" name="new_username" class="form-control mb-2" placeholder="New Username" required><input type="password" name="password" class="form-control mb-2" placeholder="Current Password" required><button type="submit" class="btn btn-warning">Change Username</button></form></div></div>
<div class="card mt-3"><div class="card-header bg-danger text-white">Change Password</div><div class="card-body"><form method="POST" action="{{ url_for('change_password') }}"><input type="password" name="current_password" class="form-control mb-2" placeholder="Current Password" required><input type="password" name="new_password" class="form-control mb-2" placeholder="New Password" required><input type="password" name="confirm_password" class="form-control mb-2" placeholder="Confirm Password" required><button type="submit" class="btn btn-danger">Change Password</button></form></div></div></div></div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h1>Assign Faculty to Subjects</h1>
<div class="row"><div class="col-md-5"><div class="card"><div class="card-header">New Assignment</div><div class="card-body"><form method="POST"><select name="faculty_id" class="form-select mb-2">{% for f in faculties %}<option value="{{ f.id }}">{{ f.user.full_name }}</option>{% endfor %}</select><select name="subject_id" class="form-select mb-2">{% for s in subjects %}<option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>{% endfor %}</select><select name="academic_year" class="form-select mb-2"><option>{{ academic_year }}</option></select><button type="submit" class="btn btn-primary">Assign</button></form></div></div></div>
<div class="col-md-7"><div class="card"><div class="card-header">Current Assignments</div><div class="card-body"><table class="table"><thead><tr><th>Faculty</th><th>Subject</th><th>Year</th><th>Actions</th></tr></thead><tbody>{% for a in assignments %}<tr><td>{{ a.faculty.user.full_name }}</td><td>{{ a.subject.name }}</td><td>{{ a.academic_year }}</td><td><button class="btn btn-sm btn-warning" onclick="editAssignment({{ a.id }})">Edit</button></td></tr>{% endfor %}</tbody></table></div></div></div></div>
<!-- edit modal omitted for brevity, same as school version -->
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<h2>Program Fee Structure</h2>
<form method="post" class="card p-3 mb-4">
  {% csrf_token %}
  <div class="row g-2">
    <div class="col-md-4">
      <select name="program_id" class="form-select" required>
        {% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <select name="semester" class="form-select">
        {% for s in semesters %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3"><input name="fee_amount" type="number" step="0.01" min="0" class="form-control" placeholder="Fee amount (₹)" required></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div>
  </div>
</form>
<table class="table">
  <thead><tr><th>Program</th><th>Semester</th><th>Fee</th><th>Year</th></tr></thead>
  <tbody>{% for f in fees %}<tr><td>{{ f.program.name }}</td><td>{{ f.semester }}</td><td>₹{{ f.fee_amount|floatformat:2 }}</td><td>{{ f.academic_year }}</td></tr>
  {% empty %}<tr><td colspan="4">No fee structure defined yet.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h1>Manage Notifications</h1>
<div class="row"><div class="col-md-4"><div class="card"><div class="card-header bg-primary text-white">Send Notification</div><div class="card-body"><form method="POST" action="{{ url_for('send_notification') }}"><input name="title" class="form-control mb-2" placeholder="Title" required><textarea name="message" class="form-control mb-2" rows="3" required></textarea><select name="notification_type" class="form-select mb-2"><option>general</option><option>urgent</option><option>event</option><option>academic</option></select><select name="audience" id="audience" class="form-select mb-2" required><option value="all">All</option><option value="students">Students</option><option value="faculty">Faculty</option><option value="specific">Specific User</option></select><div id="specificDiv" style="display:none"><select name="specific_user_id" class="form-select mb-2">{% for s in students %}<option value="{{ s.id }}">{{ s.full_name }} (Student)</option>{% endfor %}{% for f in faculty %}<option value="{{ f.id }}">{{ f.full_name }} (Faculty)</option>{% endfor %}</select></div><button type="submit" class="btn btn-primary">Send</button></form></div></div></div>
<div class="col-md-8"><div class="card"><div class="card-header bg-info text-white">Sent Notifications</div><div class="card-body"><table class="table"><thead><tr><th>Title</th><th>Message</th><th>Audience</th><th>Date</th><th>Action</th></tr></thead><tbody>{% for n in sent_notifications %}<tr><td>{{ n.title }}</td><td>{{ n.message[:50] }}</td><td>{{ n.audience }}</td><td>{{ n.created_at.strftime('%Y-%m-%d') }}</td><td><button class="btn btn-sm btn-danger" onclick="deleteNotif({{ n.id }})">Delete</button></td></tr>{% endfor %}</tbody></table></div></div></div></div>
<script>document.getElementById('audience').onchange=function(){ document.getElementById('specificDiv').style.display=this.value=='specific'?'block':'none'; };
function deleteNotif(id){ if(confirm('Delete?')) fetch('/admin/notification/delete/'+id,{method:'POST'}).then(()=>location.reload()); }</script>
{% endblock %}

{% set active_page = request.endpoint %}

<!-- ========== FACULTY SIDEBAR ========== -->

<!-- MAIN -->
<div class="nav-section">
    <div class="section-title"><i class="bi bi-grid-1x2-fill"></i> MAIN</div>
    <a class="nav-link {% if active_page == 'faculty_dashboard' %}active{% endif %}" href="{{ url_for('faculty_dashboard') }}">
        <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
    </a>
</div>

<!-- TEACHING -->
<div class="nav-section">
    <div class="section-title"><i class="bi bi-pencil-square"></i> TEACHING</div>
    <a class="nav-link {% if active_page in ['mark_attendance'] %}active{% endif %}" href="{{ url_for('mark_attendance') }}">
        <i class="bi bi-check2-square"></i> <span>Mark Attendance</span>
    </a>
    <a class="nav-link {% if active_page in ['enter_marks'] %}active{% endif %}" href="{{ url_for('enter_marks') }}">
        <i class="bi bi-pencil-square"></i> <span>Enter Marks</span>
    </a>
    <a class="nav-link {% if active_page in ['enter_exam_marks'] %}active{% endif %}" href="{{ url_for('enter_exam_marks') }}">
        <i class="bi bi-file-text"></i> <span>Enter Exam Marks</span>
    </a>
    <a class="nav-link {% if active_page in ['faculty_timetable'] %}active{% endif %}" href="{{ url_for('faculty_timetable') }}">
        <i class="bi bi-calendar-week"></i> <span>My Timetable</span>
    </a>
    <a class="nav-link {% if active_page in ['faculty_my_students'] %}active{% endif %}" href="{{ url_for('faculty_my_students') }}">
        <i class="bi bi-people"></i> <span>My Students</span>
    </a>
</div>

<!-- RESOURCES -->
<div class="nav-section">
    <div class="section-title"><i class="bi bi-cloud-upload"></i> RESOURCES</div>
    <a class="nav-link {% if active_page in ['faculty_upload_material'] %}active{% endif %}" href="{{ url_for('faculty_upload_material') }}">
        <i class="bi bi-cloud-upload"></i> <span>Upload Material</span>
    </a>
    <a class="nav-link {% if active_page in ['apply_leave'] %}active{% endif %}" href="{{ url_for('apply_leave') }}">
        <i class="bi bi-envelope"></i> <span>Apply Leave</span>
    </a>
</div>

<!-- PROFILE & LOGOUT -->
<div class="nav-section mt-auto">
    <hr>
    <a class="nav-link {% if active_page in ['profile'] %}active{% endif %}" href="{{ url_for('profile') }}">
        <i class="bi bi-person-circle"></i> <span>My Profile</span>
    </a>
    <a class="nav-link text-danger" href="{{ url_for('logout') }}">
        <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
    </a>
</div>

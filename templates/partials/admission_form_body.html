<h3 class="mb-3">Online Admission Application</h3>
{% include 'partials/messages.html' %}
<form method="post" class="card p-4">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Full name *</label><input name="full_name" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Date of birth</label><input type="date" name="dob" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">Gender</label>
      <select name="gender" class="form-select"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
    <div class="col-md-6"><label class="form-label">Father's name</label><input name="father_name" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Mother's name</label><input name="mother_name" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Program *</label>
      <select name="applying_program_id" class="form-select" required>
        <option value="">Select program</option>
        {% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select></div>
    <div class="col-md-3"><label class="form-label">Phone *</label><input name="phone" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
    <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div>
    <div class="col-12"><label class="form-label">Previous institution</label><input name="previous_institution" class="form-control"></div>
  </div>
  <button class="btn btn-primary mt-3" style="max-width:220px;">Submit Application</button>
</form>

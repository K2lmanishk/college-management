{% extends "base.html" %}
{% block content %}
<h1>Events & Holidays</h1>
<div class="row"><div class="col-md-5">
    <div class="card"><div class="card-header bg-primary text-white">Add Event</div><div class="card-body">
        <form method="POST" action="{{ url_for('add_event') }}">
            <div class="mb-2"><input name="title" class="form-control" placeholder="Title" required></div>
            <div class="mb-2"><textarea name="description" class="form-control" placeholder="Description"></textarea></div>
            <div class="mb-2"><input name="event_date" type="date" class="form-control" required></div>
            <div class="mb-2"><select name="event_type" class="form-select"><option>Holiday</option><option>Event</option><option>Exam</option></select></div>
            <button class="btn btn-primary">Add</button>
        </form>
    </div></div>
</div><div class="col-md-7">
    <div class="card"><div class="card-header bg-info text-white">All Events</div><div class="card-body">
        <table class="table"><thead><tr><th>Date</th><th>Title</th><th>Type</th></tr></thead>
        <tbody>{% for e in events %}<tr><td>{{ e.event_date.strftime('%d-%m-%Y') }}</td><td>{{ e.title }}</td><td>{{ e.event_type }}</td></tr>{% endfor %}</tbody></table>
    </div></div>
</div></div>
{% endblock %}

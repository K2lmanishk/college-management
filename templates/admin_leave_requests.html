{% extends "base.html" %}
{% block content %}
<h1>Leave Requests</h1>
<table class="table table-bordered"><thead class="table-dark"><tr><th>User</th><th>Role</th><th>From</th><th>To</th><th>Reason</th><th>Actions</th></tr></thead>
<tbody>{% for l in leaves %}<tr><td>{{ l.user.full_name }}</td><td>{{ l.user.role|capitalize }}</td><td>{{ l.start_date.strftime('%d-%m-%Y') }}</td><td>{{ l.end_date.strftime('%d-%m-%Y') }}</td><td>{{ l.reason }}</td>
<td><a href="{{ url_for('leave_action', leave_id=l.id, action='approve') }}" class="btn btn-sm btn-success">Approve</a>
<a href="{{ url_for('leave_action', leave_id=l.id, action='reject') }}" class="btn btn-sm btn-danger">Reject</a></td></tr>{% endfor %}</tbody></table>
{% endblock %}

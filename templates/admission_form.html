<!DOCTYPE html>
<html><head><title>{{ college_name }} | Admission</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background: linear-gradient(135deg, #667eea, #764ba2);"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-8">
<div class="card shadow-lg"><div class="card-header bg-primary text-white"><h3>Online Admission Form</h3><p>{{ college_name }}</p></div>
<div class="card-body">{% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST"><div class="row"><div class="col-md-6 mb-3"><label>Full Name *</label><input type="text" name="full_name" class="form-control" required></div>
<div class="col-md-6 mb-3"><label>Father's Name</label><input type="text" name="father_name" class="form-control"></div>
<div class="col-md-6 mb-3"><label>Mother's Name</label><input type="text" name="mother_name" class="form-control"></div>
<div class="col-md-3 mb-3"><label>DOB</label><input type="date" name="dob" class="form-control"></div>
<div class="col-md-3 mb-3"><label>Gender</label><select name="gender" class="form-select"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-6 mb-3"><label>Applying Program *</label><select name="applying_program_id" class="form-select" required>{% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
<div class="col-md-6 mb-3"><label>Phone *</label><input type="tel" name="phone" class="form-control" required></div>
<div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control"></div>
<div class="col-12 mb-3"><label>Address</label><textarea name="address" class="form-control"></textarea></div>
<div class="col-12 mb-3"><label>Previous Institution</label><input type="text" name="previous_institution" class="form-control"></div>
</div><button type="submit" class="btn btn-primary w-100">Submit Application</button></form>
<a href="{{ url_for('login') }}" class="d-block text-center mt-3">← Back to Login</a>
</div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>

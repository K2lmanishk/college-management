{% extends "base.html" %}
{% block content %}
<h1>Enter Marks</h1>
<form method="POST">
    <select name="subject_id" id="subjSelect" class="form-select mb-2" required>{% for a in assignments %}<option value="{{ a.subject.id }}">{{ a.subject.name }} ({{ a.subject.semester }})</option>{% endfor %}</select>
    <select name="exam_type" class="form-select mb-2" required><option>Mid Semester</option><option>End Semester</option><option>Practical</option><option>Internal Assessment</option></select>
    <input type="number" name="max_marks" id="maxMarks" class="form-control mb-2" placeholder="Maximum Marks" required>
    <button type="button" class="btn btn-info" onclick="loadStudents()">Load Students</button>
    <div id="studentMarksList" style="display:none; margin-top:20px;">
        <table class="table table-bordered"><thead class="table-dark"><tr><th>Roll No</th><th>Student</th><th>Marks</th></tr></thead><tbody id="marksTbody"></tbody></table>
        <button type="submit" class="btn btn-primary">Save Marks</button>
    </div>
</form>
<script>
function loadStudents(){
    let subj=document.getElementById('subjSelect').value, max=document.getElementById('maxMarks').value;
    if(!subj || !max) return;
    fetch('/api/get_students_by_subject/'+subj).then(res=>res.json()).then(data=>{
        let html=''; data.forEach(s=>{ html+=`<tr><td>${s.roll_no}</td><td>${s.name}</td><td><input type="number" name="marks_${s.id}" class="form-control" min="0" max="${max}" step="0.5"></td></tr>`; });
        document.getElementById('marksTbody').innerHTML=html;
        document.getElementById('studentMarksList').style.display='block';
    });
}
</script>
{% endblock %}

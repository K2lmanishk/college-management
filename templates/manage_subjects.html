{% extends "base.html" %}
{% block content %}
<h1>Manage Subjects</h1>
...
<form method="POST" action="{{ url_for('add_subject') }}">
    <div class="mb-3"><label>Program</label><select name="program_id" class="form-select">
        <option value="">All Programs (if applicable)</option>
        {% for program in programs %}<option value="{{ program.id }}">{{ program.name }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label>Semester</label><select name="semester" class="form-select" required>
        {% for sem in semesters %}<option value="{{ sem }}">{{ sem }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label>Subject Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label>Subject Code</label><input type="text" name="code" class="form-control" required></div>
    <div class="mb-3"><label>Credits</label><input type="number" name="credits" class="form-control" required></div>
    <div class="mb-3"><label>Type</label><select name="type" class="form-select"><option>Theory</option><option>Practical</option><option>Elective</option></select></div>
    <button type="submit" class="btn btn-primary">Add Subject</button>
</form>
...
{% endblock %}

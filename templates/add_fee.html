{% extends "base.html" %}
{% block content %}
<h1>Add Fee Record</h1>
<form method="POST">
    <select name="student_id" class="form-select mb-3" required>
        <option value="">Select Student</option>
        {% for s in students %}<option value="{{ s.id }}">{{ s.user.full_name }} ({{ s.roll_no }})</option>{% endfor %}
    </select>
    <input type="number" step="0.01" name="amount" class="form-control mb-3" placeholder="Amount" required>
    <input type="date" name="due_date" class="form-control mb-3" required>
    <button type="submit" class="btn btn-primary">Add Fee</button>
</form>
{% endblock %}

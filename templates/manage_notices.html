{% extends "base.html" %}
{% block content %}
<h1>Manage Notices</h1>
<div class="row"><div class="col-md-5"><div class="card"><div class="card-header bg-primary text-white">Post New Notice</div><div class="card-body"><form method="POST"><input name="title" class="form-control mb-2" placeholder="Title" required><textarea name="content" class="form-control mb-2" rows="5" required></textarea><select name="audience" class="form-select mb-2"><option value="all">All</option><option value="students">Students</option><option value="faculty">Faculty</option></select><button type="submit" class="btn btn-primary">Post Notice</button></form></div></div></div>
<div class="col-md-7"><div class="card"><div class="card-header bg-success text-white">Recent Notices</div><div class="card-body">{% for notice in notices %}<div class="card mb-2"><div class="card-body"><h5>{{ notice.title }}</h5><p>{{ notice.content }}</p><small>Audience: {{ notice.audience }} | {{ notice.created_at.strftime('%Y-%m-%d %H:%M') }}</small><button class="btn btn-sm btn-danger float-end" onclick="deleteNotice({{ notice.id }})">Delete</button></div></div>{% endfor %}</div></div></div></div>
<script>function deleteNotice(id){ if(confirm('Delete?')) fetch('/admin/notice/delete/'+id,{method:'POST'}).then(()=>location.reload()); }</script>
{% endblock %}

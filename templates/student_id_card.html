{% extends "base.html" %}
{% block content %}
<div class="container mt-4"><div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-lg"><div class="card-header bg-primary text-white text-center"><h4>Student ID Card</h4></div>
    <div class="card-body text-center">
        <img src="https://ui-avatars.com/api/?name={{ student.user.full_name }}&size=100&background=4e73df&color=fff" class="rounded-circle border border-3 border-primary" style="width:100px">
        <h5>{{ student.user.full_name }}</h5><p>{{ student.program.name if student.program else '' }} | {{ student.semester }}</p><p><strong>Roll No:</strong> {{ student.roll_no }}</p>
        <hr><p><strong>Parent Contact:</strong> {{ student.parent_contact or 'N/A' }}</p>
        <img src="{{ url_for('generate_qr', roll_no=student.roll_no) }}" style="max-width:150px"><br>
        <button class="btn btn-outline-primary mt-3" onclick="window.print()">Print ID Card</button>
    </div></div>
</div></div></div>
{% endblock %}
